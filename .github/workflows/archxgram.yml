name: ArchXgram Android (debug).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure local.properties
        run: |
          echo "apiId=38498616" >> local.properties
          echo "apiHash=cba547cf1110331d45c9ce1d721bf929" >> local.properties
          echo "mapsApiKey=dummy" >> local.properties
          echo "sentryDsn=" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=" >> local.properties

      - name: Dummy google-services.json
        run: |
          cat > TMessagesProj_App/google-services.json << 'EOF'
          {
            "project_info": {"project_number": "0", "project_id": "archxgram", "storage_bucket": "archxgram.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:0:android:0", "android_client_info": {"package_name": "com.archx.gram"}}, "api_key": [{"current_key": "dummy"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchXgram-debug
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
          retention-days: 14
